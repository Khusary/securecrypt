<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SecureCrypt</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-left">

            <div class="brand">

                <i class="fa-solid fa-shield-halved"></i>

                <h1>SecureCrypt</h1>

            </div>

            <h2>Administrator Portal</h2>

            <p>

                Access the SecureCrypt administration dashboard to manage users,
                monitor encrypted files, review activity logs, and maintain system security.

            </p>

            <div class="security-features">

                <div>

                    <i class="fa-solid fa-user-shield"></i>

                    <span>Secure Authentication</span>

                </div>

                <div>

                    <i class="fa-solid fa-lock"></i>

                    <span>AES-256 Encryption</span>

                </div>

                <div>

                    <i class="fa-solid fa-chart-line"></i>

                    <span>Activity Monitoring</span>

                </div>

            </div>

        </div>

        <div class="auth-right">

            <form id="adminLoginForm" class="auth-card">

                <h2>Admin Login</h2>

                <p class="subtitle">

                    Sign in with your administrator account.

                </p>

                <div id="loginMessage" class="message-box"></div>

                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" placeholder="Enter admin email" required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="password" placeholder="Enter password" required>

                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>

                    </div>

                </div>

                <button type="submit" id="loginBtn" class="btn-primary">

                    <span id="btnText">

                        Login

                    </span>

                </button>

            </form>

        </div>

    </div>


    <script src="Js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-login.js"></script>

</body>

</html>
