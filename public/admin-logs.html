<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity Logs | SecureCrypt</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/admin-logs.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="admin-container">

    <aside class="admin-sidebar">

        <div class="admin-logo">

            <i class="fa-solid fa-shield-halved"></i>

            <h2>SecureCrypt</h2>

            <small>Admin Panel</small>

        </div>

        <ul>

            <li>

                <a href="admin-dashboard.html">

                    <i class="fa-solid fa-gauge"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="admin-users.html">

                    <i class="fa-solid fa-users"></i>

                    Users

                </a>

            </li>

            <li>

                <a href="admin-files.html">

                    <i class="fa-solid fa-folder"></i>

                    Files

                </a>

            </li>

            <li class="active">

                <a href="admin-logs.html">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    Activity Logs

                </a>

            </li>

            <li>

                <a href="admin-profile.html">

                    <i class="fa-solid fa-user"></i>

                    Profile

                </a>

            </li>

            <li>

                <a href="#" id="logoutBtn">
                
                    <i class="fa-solid fa-right-from-bracket"></i>
                
                    Logout
                
                </a>

            </li>

        </ul>

    </aside>

    <main class="admin-main">

        <button id="menuToggle" class="menu-toggle"> <i class="fa-solid fa-bars"></i> </button>

        <div class="admin-header">

            <h1>Activity Logs</h1>

            <p>Monitor all user activities.</p>

        </div>

        <div class="logs-toolbar">

            <input
                type="text"
                id="searchLog"
                placeholder="Search user or file...">

            <select id="filterAction">

                <option value="">All Activities</option>

                <option>User Login</option>

                <option>Uploaded File</option>

                <option>Downloaded File</option>

                <option>Deleted File</option>

            </select>

        </div>

        <div class="admin-table">

            <div class="table-responsive">

            <table>

                <thead>

                    <tr>

                        <th>User</th>

                        <th>Action</th>

                        <th>File</th>

                        <th>IP Address</th>

                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="logsTable">

                </tbody>

            </table>

            </div>

        </div>

    </main>

</div>


<script src="Js/config.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-logs.js"></script>

</body>

</html>
