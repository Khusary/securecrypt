<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Decrypt Files | SecureCrypt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

  <nav class="navbar">

    <div class="logo">

      <i class="fa-solid fa-shield-halved"></i>

      <h2>SecureCrypt</h2>

    </div>

    <div class="nav-right">

      <a href="dashboard.html" class="btn">

        <i class="fa-solid fa-arrow-left"></i>

        Dashboard

      </a>

    </div>

  </nav>

  <section class="dashboard">

    <div class="welcome-card">

      <h1>Decrypt Files</h1>

      <p>

        Verify file integrity and securely decrypt your encrypted files.

      </p>

    </div>

    <div style="margin-bottom:30px;">

      <input type="text" id="search" class="input" placeholder="🔍 Search file...">

    </div>

    <div class="card">

      <table class="files-table">

        <thead>

          <tr>

            <th align="left">File Name</th>

            <th>Type</th>

            <th>Size</th>

            <th>Date</th>

            <th>Status</th>

            <th>Integrity</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="decryptTable">

        </tbody>

      </table>

    </div>

  </section>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- OTP Modal -->
  <div id="otpModal" class="otp-modal">

    <div class="otp-modal-content">

      <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

        <h2>SecureCrypt</h2>

      </div>

      <h2>Secure Decryption</h2>

      <p>

        Enter the OTP sent to your registered email.

      </p>

      <input type="text" id="otpInput" maxlength="6" placeholder="Enter 6-digit OTP" class="input">

      <div class="otp-buttons">

        <button id="verifyOtpBtn" class="btn">

          Verify OTP

        </button>

        <button id="cancelOtpBtn" class="btn btn-danger">

          Cancel

        </button>

      </div>

    </div>

  </div>


  <script src="js/config.js"></script>
  <script src="js/notification.js"></script>
  <script src="js/decrypt.js"></script>

</body>

</html>
